      HostNotAllowedError before this addition)
    terms_reference: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
    license_notes: >-
      Decision: metadata summary + link only. Crossref REST API metadata is
      broadly reusable (Crossref's own documentation states most metadata
      carries no copyright restriction), except abstracts which may be
      copyrighted; full-text redistribution is not granted by this API.
      Connector only ingests metadata fields, consistent with this decision.
    rate_limit:
