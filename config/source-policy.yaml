      reproducing, or redistributing Binance IP. Given that, and given
      robots_allowed is still "unknown" (developers.binance.com publishes
      no robots.txt at all, so the fail-closed default applies per the
      earlier operator decision), this source stays inactive regardless
      of this license decision.
    rate_limit:
