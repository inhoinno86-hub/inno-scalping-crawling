    fixture: false
    access_policy:
      robots: not_applicable
      terms: https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api
      license: GPL-3.0 (freqtrade/freqtrade)
      rate_limit: API token and operator approval required before activation
      user_agent: scalping-briefing/0.1 (approval required)
      allowlist: [https://api.github.com, https://github.com]
    robots_allowed: true
    robots_rule_matched: null
    robots_evaluated_at: "2026-08-10T00:00:00Z"
    access_decision_reason: >-
      robots evaluation is not applicable by source policy; allowlist
      extended to include github.com because release/README html_url
      fields resolve there, not api.github.com. Target repository chosen:
      freqtrade/freqtrade (53k+ stars, most widely used open-source crypto
      trading bot, directly relevant to this project's scalping domain).
    terms_reference: https://github.com/freqtrade/freqtrade/blob/develop/LICENSE
    license_notes: >-
      Decision: metadata summary + link only. freqtrade/freqtrade is
      licensed GPL-3.0 (confirmed via GitHub API repo license field),
      which governs the source code; this connector only ingests release
      notes and README text for summarization, not source code, and does
      not redistribute the repository's code. No verbatim full-README or
      full-release-note republishing — summary + link back to GitHub only.
    rate_limit:
      requests_per_minute: 80
      burst: 2
      retry_after_seconds: 60
      max_concurrency: 1
    schedule: "active"
    last_success_at: null
    cursor: null
    trust_tier: tier_1
    error_state: null
    original_url: https://github.com/freqtrade/freqtrade
    releases_url: https://api.github.com/repos/freqtrade/freqtrade/releases
    readme_url: https://api.github.com/repos/freqtrade/freqtrade/readme
    metadata: {activation: activated}

