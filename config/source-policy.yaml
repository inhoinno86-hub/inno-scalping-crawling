  - source_id: real_arxiv_api
    name: arXiv API Candidate
    type: research_api
    base_url: https://export.arxiv.org/api/query?search_query=cat:q-fin.TR&sortBy=submittedDate&sortOrder=descending&max_results=5
    connector_type: atom
    active: true
    fixture: false
    access_policy:
      robots: not_applicable
      terms: https://info.arxiv.org/help/api/
      license: arXiv terms and source-specific license review required
      rate_limit: operator approval required before activation
      user_agent: scalping-briefing/0.1 (approval required)
      allowlist: [https://export.arxiv.org, https://arxiv.org]
    robots_allowed: true
    robots_rule_matched: "/"
    robots_evaluated_at: "2026-08-09T13:41:37Z"
    access_decision_reason: >-
      robots.txt disallows / for User-agent *, but arXiv's official API
      Terms of Use (info.arxiv.org/help/api/tou.html) explicitly documents
      and authorizes "the legacy arXiv API" as a separate access channel
      with its own rate limit (1 request/3s); operator decision overrides
      the general-crawl robots disallow for this documented API endpoint.
      access_policy.robots set to not_applicable (not just the derived
      robots_allowed field) because the per-document runtime check
      re-evaluates robots.txt per item using access_policy.robots; leaving
      it "required" denied every item despite this override. allowlist
      extended to include arxiv.org because Atom entries link their
      canonical abs/ page on that host, not export.arxiv.org.
    terms_reference: https://info.arxiv.org/help/api/
    license_notes: >-
      Decision: metadata summary + link only. arXiv's official policy
      (info.arxiv.org/help/license/index.html) states "A Creative Commons
      CC0 1.0 Universal Public Domain Dedication will apply to all
      metadata" — title/authors/abstract/identifiers are freely reusable.
      Full-text (e-print) licensing varies per submission (CC BY, CC
      BY-SA, CC BY-NC-ND, or arXiv's own limited license) and is not
      redistributed. Connector only ingests the Atom feed's metadata
      fields, consistent with this decision.
    rate_limit:
      requests_per_minute: 20
      burst: 1
      retry_after_seconds: 60
      max_concurrency: 1
    schedule: "active"
    last_success_at: null
    cursor: null
    trust_tier: tier_1
    error_state: null
    original_url: https://export.arxiv.org/api/query
    metadata: {activation: activated}

